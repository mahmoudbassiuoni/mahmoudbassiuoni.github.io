/* VOICE: a polished personal-finance app — calm, trustworthy, quick to use one-handed.
   IDEA: the Egyptian دفتر حسابات reborn as a banking app: one deep "card" with your net, ledgers below.
   PICTURE: the hero balance card + live lists and spending bars; the working tool is the picture.
   COLOUR and TYPE: deep teal card #0c3b3a, teal = ليك, rose = عليك, warm category colours; Lalezar figures, Plex Arabic text.
   LAYOUT: single app column, bottom navigation, floating + button, sheets for details. */
:root{color-scheme:light dark;
--bg:light-dark(#f1f2ee,#0f1211);--card:light-dark(#ffffff,#191d1b);--ink:light-dark(#13201e,#e7ece9);
--mute:light-dark(#69736f,#95a09b);--line:light-dark(#e3e6df,#272d2a);--soft:light-dark(#f5f6f2,#202523);
--plus:light-dark(#0a7a6c,#3fd0bc);--minus:light-dark(#c2334d,#ff8299);--hero:#0c3b3a;--heroInk:#e9f6f2;--gold:#ffcf5a;
--sh:light-dark(0 1px 2px rgb(0 0 0/.05),0 1px 2px rgb(0 0 0/.4))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;padding:14px 14px 120px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.top h1{font:400 30px/1 Lalezar,"IBM Plex Sans Arabic",sans-serif;margin:0;flex:1}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--plus)}.dot.busy{background:#d99a00}.dot.off{background:var(--mute)}
.ib{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.ib:hover{background:var(--soft)}
:focus-visible{outline:2px solid var(--plus);outline-offset:2px}
.hero{background:var(--hero);color:var(--heroInk);border-radius:22px;padding:20px 20px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgb(255 255 255/.10),transparent 70%)}
.hero small{opacity:.75;font-size:13px}
.hero .net{font:400 clamp(34px,9vw,46px)/1.1 Lalezar,sans-serif;margin:4px 0 2px;white-space:nowrap}
.hero .lbl{font-size:13px;opacity:.85}
.hsplit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.hsplit div{background:rgb(255 255 255/.08);border-radius:14px;padding:10px}
.hsplit b{display:block;font:400 18px/1.2 Lalezar,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsplit .a{color:#7ff0dc}.hsplit .b{color:#ffb3c1}.hsplit .c{color:var(--gold)}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.qa button{font:inherit;font-size:13px;cursor:pointer;border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh)}
.qa .i{color:var(--plus)}
.sec{margin-top:20px}
.sec h3{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 a{font-size:13px;font-weight:500;color:var(--plus);cursor:pointer;text-decoration:none}
.box{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}.row:hover{background:var(--soft)}
.av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px}
.nm{flex:1}.nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mute);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap;text-align:left}.amt small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.pl{color:var(--plus)}.mi{color:var(--minus)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--minus);color:#fff;margin-inline-start:6px;vertical-align:2px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);font-size:14px}
.bars .br{padding:10px 14px;border-bottom:1px solid var(--line)}.bars .br:last-child{border:0}
.br .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:8px}.br .t b{white-space:nowrap}
.track{height:8px;border-radius:6px;background:var(--soft);overflow:hidden}.track i{display:block;height:100%;border-radius:6px}
.wsel button .i{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.bdg{display:inline-grid;place-items:center;min-width:44px;height:26px;padding:0 7px;border-radius:9px;color:#fff;font:700 11px/1 inherit;letter-spacing:0;white-space:nowrap;vertical-align:middle;box-shadow:inset 0 0 0 1px rgb(255 255 255/.18)}.wcard small .bdg{height:22px;min-width:38px;font-size:10px;margin-inline-end:4px}.av .bdg{min-width:0;width:100%;height:100%;border-radius:inherit;padding:0 2px;font-size:10px}#wfPrev{margin-top:8px}
.salc{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 0 12px;cursor:pointer;border-inline-start:5px solid #0a7a6c}.salc .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#0a7a6c;color:#fff;flex:none}.salc .t{flex:1;display:flex;flex-direction:column}.salc small{color:var(--mute)}.salc .btn{background:#0a7a6c;pointer-events:none}
.happ{margin-top:10px;display:flex;justify-content:space-between;align-items:baseline;font-size:14px;opacity:.85;border-top:1px dashed rgb(255 255 255/.25);padding-top:8px}.happ small{opacity:.7}
.hexp{margin-top:12px;padding:10px 12px;border-radius:14px;background:rgb(255 255 255/.10);display:flex;flex-direction:column;gap:2px}.hexp div{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.hexp small{opacity:.8}.hexp b{font-size:20px}.hexp span{font-size:12px;opacity:.75}
.rsrc{display:flex;flex-direction:column;gap:6px}.rsrc button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.rsrc button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.rsrc button[disabled]{opacity:.45;cursor:default}.rsrc span{display:flex;flex-direction:column}.rsrc small{color:var(--mute);font-size:12px}
.vcard{cursor:pointer;margin:0 0 12px;padding:16px 18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#1b1f2a,#3a3f4f 60%,#c99a2e);box-shadow:var(--sh);direction:ltr;font-family:ui-monospace,monospace}.vtop{display:flex;justify-content:space-between;font-size:14px;opacity:.9}.vnum{font-size:19px;letter-spacing:2px;margin:22px 0 14px}.vbot{display:flex;gap:22px;font-size:13px}.vbot small{display:block;font-size:10px;opacity:.7;font-family:inherit}
.hsearch[hidden]{display:none}.hsearch{margin:2px 0 14px;min-height:48px;cursor:text}.hsearch input{font-size:16px}.hsearch input::-webkit-search-cancel-button{display:none}.hqx{all:unset;cursor:pointer;padding:6px 4px;color:var(--mute);font-size:15px}.hqx[hidden]{display:none}#sres{margin-bottom:90px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;box-shadow:var(--sh);margin-bottom:10px}
.search input{border:0;background:transparent;padding:12px 0;min-height:46px;box-shadow:none}
.search input:focus{outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:30px;padding:7px 14px;white-space:nowrap;min-height:38px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fcard{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);cursor:pointer;border-top:5px solid var(--c)}
.fcard b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .v{font:400 24px/1.2 Lalezar,sans-serif;margin:6px 0 2px;white-space:nowrap}
.fcard small{color:var(--mute);font-size:12px;display:block}
.fcard .track{margin-top:8px;height:6px}
.fnew{display:grid;place-items:center;color:var(--mute);border:2px dashed var(--line);box-shadow:none;background:transparent;min-height:120px;border-top-width:2px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
input:focus,select:focus{outline:2px solid var(--plus);border-color:transparent}
.btn{font:inherit;font-weight:700;cursor:pointer;border:0;background:var(--hero);color:#fff;border-radius:14px;padding:11px 18px;min-height:46px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--minus);border:1px solid var(--minus)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wa{background:#1f9d55}
.btns{display:flex;gap:8px;flex-wrap:wrap}
nav{position:fixed;bottom:0;inset-inline:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:8px 0 10px;min-height:44px}
nav button.on{color:var(--ink);font-weight:700}nav button.on .i{color:var(--plus)}
nav .fab{width:56px;height:56px;border-radius:18px;background:var(--hero);color:#fff;display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 6px 16px rgb(12 59 58/.35);padding:0}
nav .fab .i{width:28px;height:28px;color:#fff}
.sheet{position:fixed;inset:0;background:rgb(0 0 0/.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.card{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(110px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.card::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
@media(min-width:700px){.sheet{align-items:center}.card{border-radius:24px;max-height:86vh}}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hd h2{font:400 26px/1.15 Lalezar,sans-serif;margin:0;flex:1;display:flex;align-items:center;gap:10px}
.pbal{border-radius:18px;padding:16px;color:#fff;margin-bottom:12px}
.pbal .big{font:400 clamp(30px,8vw,40px)/1.1 Lalezar,sans-serif}
.pbal small{opacity:.85}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:10px}
.seg button{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 6px;min-height:46px;line-height:1.3}
.seg button.on.p{background:var(--plus);border-color:var(--plus);color:#fff}
.seg button.on.m{background:var(--minus);border-color:var(--minus);color:#fff}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px}
.form{background:var(--card);border-radius:18px;padding:12px;margin-bottom:14px;box-shadow:var(--sh)}
.form label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
.tx{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.tx:last-child{border:0}
.tx .ti{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px}
.tx .t{flex:1}.tx .t small{display:block;color:var(--mute);font-size:12px}
.tx .del{all:unset;cursor:pointer;color:var(--mute);width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
.tx .del:hover{color:var(--minus);background:var(--soft)}
.mbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;height:120px;padding:12px 14px 0}
.mbars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute);gap:4px}
.mbars i{display:block;width:70%;border-radius:6px 6px 2px 2px;min-height:2px}
.mbars span{padding-bottom:8px;white-space:nowrap}
details{background:var(--card);border-radius:14px;padding:10px 14px;margin:10px 0;box-shadow:var(--sh);font-size:14px}
summary{cursor:pointer;font-weight:600}
details ol{margin:8px 0 2px;padding-inline-start:20px;color:var(--mute)}
.toast{position:fixed;top:14px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;font-size:14px}
.toast.on{opacity:1;pointer-events:auto}
.toast button{all:unset;cursor:pointer;font-weight:700;margin-inline-start:12px;text-decoration:underline}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--ink)}
.muted{color:var(--mute);font-size:13px}
:root[data-skin=light]{color-scheme:light}:root[data-skin=dark]{color-scheme:dark}
:root[data-skin=dim]{color-scheme:dark;--bg:#2a2f32;--card:#343a3d;--ink:#e8ebec;--mute:#a7afb3;--line:#454c50;--soft:#3c4346}
:root[data-skin=slate]{color-scheme:light;--bg:#dce1e2;--card:#eef1f1;--ink:#182022;--mute:#5a6669;--line:#c9d1d3;--soft:#e3e8e9}
:root[data-skin=sand]{color-scheme:light;--bg:#ece3d4;--card:#faf5ec;--ink:#2a231b;--mute:#776b5d;--line:#dccfbc;--soft:#f2e9db}
:root[data-skin=mint]{color-scheme:light;--bg:#dff1ea;--card:#f7fcfa;--ink:#10241e;--mute:#577069;--line:#c7e2d7;--soft:#e9f6f1}
:root[data-skin=sky]{color-scheme:light;--bg:#dcebf7;--card:#f6fafe;--ink:#0f1e2c;--mute:#566b7f;--line:#c6d9ea;--soft:#e8f1fa;--hero:#123c5c}
:root[data-skin=rose]{color-scheme:light;--bg:#f6e3e6;--card:#fffafa;--ink:#2b1619;--mute:#7b5d62;--line:#ecd0d5;--soft:#fbeef0;--hero:#5c1f2c}
:root[data-skin=lav]{color-scheme:light;--bg:#e8e4f3;--card:#fbfaff;--ink:#1d1830;--mute:#655e7e;--line:#d8d1ec;--soft:#f1eef9;--hero:#2e2457}
:root[data-skin=peach]{color-scheme:light;--bg:#fbe5d6;--card:#fffaf6;--ink:#2c1c12;--mute:#7d6252;--line:#f0d2bd;--soft:#fdf0e6;--hero:#6b3417}
:root[data-skin=olive]{color-scheme:dark;--bg:#1d2318;--card:#272f21;--ink:#e6ecdd;--mute:#9fab92;--line:#38432f;--soft:#2e3727;--hero:#3d5a2a}
:root[data-skin=coffee]{color-scheme:dark;--bg:#241b16;--card:#30251f;--ink:#f0e6dc;--mute:#b09d8c;--line:#45362c;--soft:#382b24;--hero:#5a3a24}
:root[data-skin=amoled]{color-scheme:dark;--bg:#000;--card:#0d0d0d;--ink:#eaeaea;--mute:#8f8f8f;--line:#222;--soft:#151515}
:root[data-skin=dots]{color-scheme:light}:root[data-skin=dots] body{background:radial-gradient(circle,rgb(12 59 58/.13) 1.2px,transparent 1.6px) 0 0/18px 18px,var(--bg)}
:root[data-skin=grid]{color-scheme:light;--bg:#f6f6f1}:root[data-skin=grid] body{background:linear-gradient(rgb(12 59 58/.07) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgb(12 59 58/.07) 1px,transparent 1px) 0 0/22px 22px,var(--bg)}
:root[data-skin=navy]{color-scheme:dark;--bg:#0b1220;--card:#131c2e;--ink:#e3e9f5;--mute:#93a0b8;--line:#223049;--soft:#1a2539;--hero:#174067}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.skins button{font:inherit;font-size:13px;cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;gap:6px;align-items:stretch}
.skins button.on{border-color:var(--plus);font-weight:700}
.skins i{display:flex;height:38px;border-radius:9px;border:1px solid rgb(128 128 128/.35);overflow:hidden}
.skins i b{flex:1}
.wallets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wcard{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);cursor:pointer;border:0;font:inherit;color:var(--ink);text-align:start}
.wcard small{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:6px}
.wcard .v{font:400 clamp(22px,6vw,28px)/1.2 Lalezar,sans-serif;margin:4px 0 0;white-space:nowrap;display:block}
.wcard .v.neg{color:var(--minus)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.acts button{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:0;border-radius:14px;min-height:50px;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.daynav{display:flex;align-items:center;gap:6px;margin:20px 0 8px}
.daynav b{flex:1;text-align:center;font-size:16px}
.daynav .ib{background:var(--card);box-shadow:var(--sh);font-size:20px}
.dsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.dsum div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
.dsum small{display:block;color:var(--mute);font-size:12px}
.dsum b{font:400 20px/1.3 Lalezar,sans-serif;white-space:nowrap}
.wsel{display:flex;gap:6px;margin-bottom:10px}
.wsel button{flex:1;font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-height:44px}
.wsel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:20px;background:var(--soft);color:var(--mute);margin-inline-start:4px;vertical-align:1px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:110px;padding:12px 14px 0}
.wk div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute);gap:4px;cursor:pointer}
.wk i{display:block;width:70%;border-radius:6px 6px 2px 2px;min-height:2px;background:var(--minus)}
.wk div.on span{color:var(--ink);font-weight:700}
.wk span{padding-bottom:8px;white-space:nowrap}

const RSRC=[['ca','Currency API','fawazahmed0 · بيتحدّث كل يوم',['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json','https://latest.currency-api.pages.dev/v1/currencies/usd.min.json'],j=>j.usd&&j.usd.egp],

function applyRate(){const q=S.usdQ||{},k=usrc();if(k==='manual')return;const v=(q[k]&&q[k].v)||(RSRC.map(r=>q[r[0]]).find(x=>x&&x.v)||{}).v;if(v){S.usd=v;S.usdAt=(q[k]&&q[k].t)||Date.now()}}
async function fetchRate(force){if(rateBusy||!S.wallets.some(w=>w.cur==='USD'))return false;if(!force&&S.usdAt&&Date.now()-S.usdAt<3*36e5)return false;rateBusy=1;
 const one=async(urls,f)=>{for(const u of urls){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);const r=await fetch(u,{cache:'no-store',signal:ctl.signal});clearTimeout(tm);if(!r.ok)continue;const v=+f(await r.json());if(v>5&&v<1000)return Math.round(v*100)/100}catch(e){}}return null};
 try{const res=await Promise.all(RSRC.map(r=>one(r[3],r[4])));let any=false;S.usdQ=S.usdQ||{};RSRC.forEach((r,i)=>{if(res[i]){S.usdQ[r[0]]={v:res[i],t:Date.now()};any=true}});
  if(!any)return false;if(usrc()!=='manual')applyRate();else S.usdAt=S.usdAt||Date.now();save();if(!open)render();return true}finally{rateBusy=0}}

const vcB64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),vcU8=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function vcKey(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode('daftar-card:'+pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vcLock(obj,pin){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await vcKey(pin,salt),new TextEncoder().encode(JSON.stringify(obj)));return{s:vcB64(salt),i:vcB64(iv),c:vcB64(ct)}}
async function vcOpen(e,pin){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:vcU8(e.i)},await vcKey(pin,vcU8(e.s)),vcU8(e.c));return JSON.parse(new TextDecoder().decode(pt))}catch(x){return null}}

function qp(s){const by=[];for(let i=0;i<s.length;i++){if(s[i]==='='&&/^[0-9A-F]{2}$/i.test(s.substr(i+1,2))){by.push(parseInt(s.substr(i+1,2),16));i+=2}else{const cc=s.charCodeAt(i);if(cc<128)by.push(cc);else by.push(...new TextEncoder().encode(s[i]))}}return new TextDecoder().decode(new Uint8Array(by))}
const unesc=v=>v.replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
function parseVCF(text){
 const raw=text.replace(/\r\n?/g,'\n').split('\n'),lines=[];
 for(const l of raw){const n=lines.length,prev=lines[n-1];
  if(n&&/^[ \t]/.test(l))lines[n-1]=prev+l.slice(1);
  else if(n&&/QUOTED-PRINTABLE/i.test(prev.split(':')[0])&&prev.endsWith('='))lines[n-1]=prev.slice(0,-1)+l;
  else lines.push(l)}
 const out=[];let cur=null;
 for(const line of lines){const up=line.trim().toUpperCase();
  if(up==='BEGIN:VCARD'){cur={fn:'',n:'',org:'',tels:[]};continue}
  if(up==='END:VCARD'){if(cur){const name=cur.fn||cur.n||cur.org||cur.tels[0]||'';if(name)out.push({n:name,p:cur.tels[0]||''})}cur=null;continue}
  if(!cur)continue;const i=line.indexOf(':');if(i<0)continue;
  const key=line.slice(0,i),prop=key.split(';')[0].toUpperCase().replace(/^ITEM\d+\./,'');let v=line.slice(i+1);
  if(/ENCODING=QUOTED-PRINTABLE/i.test(key))v=qp(v);
  if(prop==='FN')cur.fn=unesc(v);
  else if(prop==='N'){const a=v.split(';').map(unesc);cur.n=[a[3],a[1],a[2],a[0],a[4]].filter(Boolean).join(' ')}
  else if(prop==='ORG')cur.org=unesc(v.split(';')[0]);
  else if(prop==='TEL'){const t=v.replace(/^tel:/i,'').trim();if(t)cur.tels.push(t)}}
 return out}
function parseCSV(text){
 const rows=[];let row=[],f='',q=false;text=text.replace(/^﻿/,'');
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===','||ch===';'||ch==='\t'){row.push(f);f=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
 if(f||row.length){row.push(f);rows.push(row)}
 if(!rows.length)return[];
 const h=rows[0].map(x=>x.trim().toLowerCase());
 let ni=h.findIndex(x=>/^(name|full name|display name|الاسم|اسم)$/.test(x)),fi=h.findIndex(x=>/first name|given name|الاسم الأول/.test(x)),li=h.findIndex(x=>/last name|family name|اسم العائلة/.test(x));
 const pi=h.map((x,i)=>/(phone|mobile|tel|هاتف|موبايل|جوال|رقم)/.test(x)&&!/(type|label|نوع)/.test(x)?i:-1).filter(i=>i>=0);
 let data=rows.slice(1);
 if(ni<0&&fi<0&&!pi.length){ni=0;pi.push(1);data=rows}
 const out=[];
 for(const r of data){const name=(ni>=0?r[ni]:[r[fi],r[li]].filter(Boolean).join(' '))?.trim();
  const ph=pi.map(i=>r[i]||'').join(' ::: ').split(':::').map(s=>s.trim()).filter(Boolean)[0]||'';
  if(name||ph)out.push({n:name||ph,p:ph})}
 return out}
function addContacts(list){

 for(const c of list){c.n=String(c.n).trim();c.p=String(c.p||'').trim();const k=c.n+'|'+normP(c.p);if(!c.n||seen.has(k))continue;seen.add(k);C.push(c);added++}
 C.sort((a,b)=>a.n.localeCompare(b.n,'ar'));save('C');view='contacts';qC='';render();
 const A=addedSet(),todo=[],seen2=new Set();
 for(const c of list){const n=String(c.n||'').trim();if(!n)continue;const x={n,p:String(c.p||'').trim()};const k=n+'|'+normP(x.p);if(seen2.has(k)||isAdded(x,A))continue;seen2.add(k);todo.push(x)}
 if(!todo.length){toast('كل الأرقام اللي في الملف مضافة بالفعل');return}

/* ---------- Google Drive auto backup ---------- */
const GSC='https://www.googleapis.com/auth/drive.appdata',GAPI='https://www.googleapis.com';
const GCID_DEF='539562884900-qaoe259426nuptoo34dfd17db8a9ebrl.apps.googleusercontent.com';
const gcid=()=>LS.get('daftar_gcid')||GCID_DEF;
const gtok=()=>{const t=LS.get('daftar_gtok');return t&&t.exp>Date.now()+60000?t.at:null};
const gOK=()=>location.protocol==='https:'&&!inArtifact;
let gNeed=false,gBusy=false;
function gAuth(silent,man){const st=uid();LS.set('daftar_gstate',{st,silent:!!silent,man:!!man});
 location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:gcid(),redirect_uri:location.origin+location.pathname,response_type:'token',scope:GSC,include_granted_scopes:'true',state:st,prompt:silent?'none':'consent'})}
async function gfetch(u,o={}){const t=gtok();if(!t){gNeed=true;throw new Error('auth')}
 const r=await fetch(u,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+t}});if(r.status===401||r.status===403&&!o.noAuthReset){if(r.status===401){LS.set('daftar_gtok',null);gNeed=true;throw new Error('auth')}}if(!r.ok)throw new Error('http '+r.status);return r}
async function gList(){const r=await gfetch(GAPI+'/drive/v3/files?spaces=appDataFolder&pageSize=60&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime,size)');return (await r.json()).files||[]}
async function gPut(name,data,id){if(id)return gfetch(GAPI+'/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:data});
 const b='dftr'+uid(),body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name,parents:['appDataFolder']})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+data+'\r\n--'+b+'--';
 return gfetch(GAPI+'/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})}
async function driveBackup(manual){if(!gOK()||!gcid())return;if(!gtok()){gNeed=true;if(manual)gAuth(false);else render();return}
 if(gBusy)return;gBusy=true;bkIcon();if(manual)toast('بيحفظ على Drive…');
 try{const data=JSON.stringify({...S,contacts:C,v:2}),files=await gList(),dn='daftar-'+today()+'.json';
  await gPut('daftar-backup.json',data,(files.find(f=>f.name==='daftar-backup.json')||{}).id);
  await gPut(dn,data,(files.find(f=>f.name===dn)||{}).id);
  const old=files.filter(f=>/^daftar-\d{4}-\d\d-\d\d\.json$/.test(f.name)&&f.name!==dn).sort((a,b)=>b.name.localeCompare(a.name)).slice(6);
  for(const f of old){try{await gfetch(GAPI+'/drive/v3/files/'+f.id,{method:'DELETE'})}catch(e){}}
  LS.set('daftar_gbk',Date.now());LS.set('daftar_gdirty',0);bkMark();gNeed=false;if(manual)toast('اتحفظت على Google Drive ✅');if(open&&(open.kind==='settings'||open.kind==='bkSheet'))renderSheet()}
 catch(e){if(e.message==='auth'){gNeed=true;if(manual)gAuth(false)}else if(manual)toast('مقدرتش أوصل لـ Drive، اتأكد من النت')}
 finally{gBusy=false;render()}}
const gAuto=()=>gOK()&&!!gcid()&&!!LS.get('daftar_gauto');
function bkIcon(){const d=$('bkDot');if(!d)return;const st=bkStatus();d.className=gBusy?'b':st.ok?'g':gAuto()||LS.get('daftar_lastbk')?'r':'';$('bkBtn').title=st.t+' · '+st.s}
function gAutoRenew(){try{if(navigator.onLine===false||!gAuto()||gtok()||!LS.get('daftar_gdirty')||/access_token=|error=/.test(location.hash))return false;
 const now=Date.now(),f=+LS.get('daftar_gsilfail')||0,t=+LS.get('daftar_gsil')||0;if(now-f<6*36e5||now-t<10*6e4)return false;LS.set('daftar_gsil',now);gAuth(true);return true}catch(e){return false}}
function gSchedule(){if(!gAuto())return;clearTimeout(timers.g);timers.g=setTimeout(()=>driveBackup(false),4000)}
(function gReturn(){const h=location.hash;if(!/access_token=|error=/.test(h))return;const q=new URLSearchParams(h.slice(1)),st=LS.get('daftar_gstate')||{};
 try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 if(!st.st||q.get('state')!==st.st)return;LS.set('daftar_gstate',null);
 if(q.get('access_token')){LS.set('daftar_gtok',{at:q.get('access_token'),exp:Date.now()+(+q.get('expires_in')||3600)*1000});LS.set('daftar_gauto',true);setTimeout(()=>{toast('اتربط Google Drive ✅');driveBackup(false)},1200)}
 else if(st.silent&&st.man&&/interaction_required|login_required|consent_required/.test(q.get('error')||''))setTimeout(()=>gAuth(false),300);
 else if(st.silent){LS.set('daftar_gsilfail',Date.now());gNeed=true;setTimeout(bkIcon,300)}
 else setTimeout(()=>toast('الربط مع جوجل اتلغى'),1200)})();
window.addEventListener('storage',e=>{if(e.key==='daftar_gtok'&&gtok()){gNeed=false;render();gSchedule()}});
/* ---------- lock ---------- */
async function phash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('daftar:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const c of 'daftar:'+s)h=(h*131+c.charCodeAt(0))%2147483647;return 'x'+h}}
let pinBuf='';
const pinLen=()=>+(LS.get('daftar_pinlen')||4);
/* fingerprint (WebAuthn platform authenticator, local unlock only) */
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bioAvail(){try{return location.protocol==='https:'&&!inArtifact&&!!window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}catch(e){return false}}
async function bioEnable(){try{const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'دفتري',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'daftari',displayName:'دفتري'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
 if(!cred)return false;LS.set('daftar_bio',b64(cred.rawId));return true}catch(e){return false}}
async function bioUnlock(){const id=LS.get('daftar_bio');if(!id)return false;try{const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:ub64(id)}],userVerification:'required',timeout:60000}});
 if(a&&a.response&&new Uint8Array(a.response.authenticatorData)[32]&4){$('lock').hidden=true;pinBuf='';return true}}catch(e){}return false}
const lockOn=()=>{if(!LS.get('daftar_pin'))return;pinBuf='';const n=pinLen();$('dots').querySelectorAll('i').forEach((d,i)=>d.style.display=i<n?'':'none');drawDots();$('lock').hidden=false;
 const hasB=!!LS.get('daftar_bio');$('lock').classList.toggle('bio',hasB);$('lockMsg').textContent=hasB?'افتح بالبصمة':'اكتب الرقم السري';if(hasB)setTimeout(bioUnlock,350)};
$('usePin').addEventListener('click',()=>{$('lock').classList.remove('bio');$('lockMsg').textContent='اكتب الرقم السري';pinBuf='';drawDots()});
const drawDots=()=>$('dots').querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
$('bioBtn').addEventListener('click',()=>bioUnlock());
$('lock').addEventListener('click',async e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,n=pinLen();
 if(k==='x')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<n)pinBuf+=k;drawDots();
 if(pinBuf.length===n){const ok=(await phash(pinBuf))===LS.get('daftar_pin');if(ok){$('lock').hidden=true;pinBuf=''}else{const d=$('dots');d.classList.add('bad');setTimeout(()=>{d.classList.remove('bad');pinBuf='';drawDots()},400)}}});
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else{if(hiddenAt&&Date.now()-hiddenAt>60000)lockOn();ensureW();if(runRec()){save();render()}}});

skin=LS.get('daftar_skin')||S.skin||'auto';applySkin();HIDE=!!LS.get('daftar_hide');ensureW();if(runRec())save();setTimeout(notifyOpen,1500);setTimeout(remSnap,2000);setTimeout(()=>{if(gAuto()&&new Date(LS.get('daftar_gbk')||0).toDateString()!==new Date().toDateString())driveBackup(false)},5000);
const lc=LS.get('daftar_contacts');if(Array.isArray(lc))C=lc;
render();status('على الجهاز','off');
(async()=>{
 let tries=0;while(typeof window.claude==='undefined'&&tries<8){await new Promise(r=>setTimeout(r,250));tries++}
 if(typeof window.claude==='undefined'||!window.claude.use){status('محفوظ على الجهاز','off');return}
 inArtifact=true;status('بيحمّل…','busy');
 const timer=setTimeout(()=>status('على الجهاز ده بس','off'),10000);
 try{
  window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{});
  const db=await window.claude.use('db'),user=await window.claude.use('user');
  if(!db||!user){clearTimeout(timer);status('على الجهاز ده بس','off');return}
  const id=await user.id(),col=db.collection('data/users/'+id);ref=col.doc('ledger');refC=col.doc('contacts');
  const rd=r=>r&&(typeof r.data==='function'?r.data():(r.data!==undefined?r.data:r));
  const [a,b]=await Promise.all([ref.get(),refC.get()]);clearTimeout(timer);
  const cl=x=>x==null?x:JSON.parse(JSON.stringify(x));const d=cl(rd(a)),dc=cl(rd(b));
  if(d&&Array.isArray(d.people)){S={people:d.people,tx:d.tx||[],funds:d.funds||[],exp:d.exp||[],mv:d.mv||[],wallets:d.wallets,rec:d.rec||[],gam:d.gam||[],loans:d.loans||[],sal:d.sal||null,vcph:d.vcph,usd:d.usd,usdAt:d.usdAt,usdAuto:d.usdAuto,usdSrc:d.usdSrc,usdQ:d.usdQ,wMig28:d.wMig28,wMig30:d.wMig30,nDays:d.nDays,nOwe:d.nOwe,goals:d.goals||[],budget:d.budget||0,wMig8:d.wMig8,cur:d.cur||'ج.م',skin:d.skin};if(S.skin&&!LS.get('daftar_skin')){skin=S.skin;applySkin()}}else if(S.people.length||S.funds.length)save();
  if(dc&&Array.isArray(dc.list))C=dc.list;else if(C.length)save('C');
  ensureW();if(runRec())save();cloud=true;status('محفوظ');render();notifyOpen();
 }catch(err){clearTimeout(timer);ref=refC=null;status('على الجهاز ده بس','off')}
})();
