plugins {
    id 'com.android.application'
}
// Firebase (instant update pushes) — reads app/google-services.json
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Signed with the same android.keystore as Daftari (D:\daftari\keys).
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ks.load(it) } }
def envPass = System.getenv('RASD_KS_PASS')
if (envPass) { ks['storePassword'] = envPass; if (!ks['keyPassword']) ks['keyPassword'] = envPass }
def envKeyPass = System.getenv('RASD_KEY_PASS')
if (envKeyPass) ks['keyPassword'] = envKeyPass
def envKsFile = System.getenv('RASD_KS_FILE')   // set by the GitHub build
if (envKsFile) ks['storeFile'] = envKsFile
if (!ks['storeFile']) ks['storeFile'] = 'D:/daftari/keys/android.keystore'
if (!ks['keyAlias']) ks['keyAlias'] = 'android'
def canSign = ks['storePassword'] as boolean

android {
    namespace 'com.mahmoud.rasd'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mahmoud.rasd'
        minSdk 24
        targetSdk 35
        versionCode 16
        versionName '1.0.15'
    }

    signingConfigs {
        rasd {
            if (canSign) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSign) signingConfig signingConfigs.rasd
        }
        debug {
            // same key in debug too, so Google sign-in works when you press Run in Android Studio
            if (canSign) signingConfig signingConfigs.rasd
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        noCompress += ['woff2', 'wasm']
    }
}

// Kotlin 1.8+ already contains the jdk7/jdk8 classes; the old copies pulled in by
// a dependency clash with it ("Duplicate class kotlin...") — drop them.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Google Drive backup (drive.appdata) through Google Identity authorization
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    // instant "new update" notifications (Firebase Cloud Messaging)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
