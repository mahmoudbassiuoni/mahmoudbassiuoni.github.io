# Sends an instant "new update" notification to every phone with Daftari
# whenever version.json changes. Needs the repo secret FCM_SA
# (Firebase service-account JSON). Without it, this step is skipped.
name: Notify new Daftari version
on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Send push to topic "updates"
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
        run: |
          if [ -z "$FCM_SA" ]; then echo "FCM_SA secret not set — skipping"; exit 0; fi
          pip install -q google-auth requests
          python3 - <<'PY'
          import json, os, subprocess, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          v = json.load(open('version.json'))
          try:
              old = json.loads(subprocess.check_output(['git', 'show', 'HEAD~1:version.json']).decode())
          except Exception:
              old = {}
          if old.get('code') == v.get('code'):
              print('version code unchanged — no notification'); raise SystemExit(0)
          sa = json.loads(os.environ['FCM_SA'])
          cred = service_account.Credentials.from_service_account_info(sa, scopes=['https://www.googleapis.com/auth/firebase.messaging'])
          cred.refresh(Request())
          notes = (v.get('notes') or 'افتح دفتري ونزّل التحديث').replace('• ', '')
          msg = {'message': {
              'topic': 'updates',
              'notification': {'title': 'تحديث جديد لدفتري (%s)' % v.get('name', ''), 'body': notes},
              'data': {'code': str(v.get('code', '')), 'name': str(v.get('name', ''))},
              'android': {'priority': 'high', 'notification': {'channel_id': 'daftari_updates', 'color': '#0C3B3A'}}}}
          r = requests.post('https://fcm.googleapis.com/v1/projects/%s/messages:send' % sa['project_id'],
                            headers={'Authorization': 'Bearer ' + cred.token}, json=msg, timeout=30)
          print(r.status_code, r.text[:300]); r.raise_for_status()
          PY
