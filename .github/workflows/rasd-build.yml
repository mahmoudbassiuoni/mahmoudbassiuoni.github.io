# Builds, signs and publishes Rasd whenever rasd-src/ changes, then sends the
# instant "new update" push. Secrets: RASD_KEYSTORE (base64 of android.keystore),
# RASD_KS_PASS, RASD_GSERVICES (google-services.json text), FCM_SA (already set for Daftari).
name: Build and publish Rasd
on:
  push:
    branches: [main]
    paths: ['rasd-src/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: rasd-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Secrets → files
        id: sec
        env:
          RASD_KEYSTORE: ${{ secrets.RASD_KEYSTORE }}
          RASD_GSERVICES: ${{ secrets.RASD_GSERVICES }}
        run: |
          if [ -z "$RASD_KEYSTORE" ]; then echo "::warning::RASD_KEYSTORE secret is not set yet — skipping the build"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "$RASD_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/rasd.keystore"
          if [ -n "$RASD_GSERVICES" ]; then printf '%s' "$RASD_GSERVICES" > rasd-src/android-app/app/google-services.json; fi
      - name: Build signed APK
        if: steps.sec.outputs.ok == 'true'
        working-directory: rasd-src/android-app
        env:
          RASD_KS_FILE: ${{ runner.temp }}/rasd.keystore
          KS_PASS_RAW: ${{ secrets.RASD_KS_PASS }}
        run: |
          # ignore spaces / line breaks that sneak in when the secret is pasted
          export RASD_KS_PASS="$(printf '%s' "$KS_PASS_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "password length: ${#RASD_KS_PASS}"
          gradle --no-daemon assembleRelease
      - name: Publish APK, web app and version.json
        if: steps.sec.outputs.ok == 'true'
        run: |
          set -e
          G=rasd-src/android-app/app/build.gradle
          CODE=$(grep -oP "versionCode\s+\K[0-9]+" $G)
          NAME=$(grep -oP "versionName\s+'\K[^']+" $G)
          APK=rasd-src/android-app/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" rasd/rasd.apk
          WWW=rasd-src/android-app/app/src/main/assets/www
          rm -rf rasd/lib rasd/fonts && cp -r $WWW/lib $WWW/fonts rasd/
          python3 - "$CODE" "$NAME" <<'PY'
          import json, os, sys
          code, name = int(sys.argv[1]), sys.argv[2]
          s = open('rasd-src/android-app/app/src/main/assets/www/index.html', encoding='utf-8').read()
          s = s.replace('<meta name="theme-color" content="#ffffff">', '<meta name="theme-color" content="#ffffff">\n<link rel="manifest" href="manifest.webmanifest">\n<link rel="icon" href="icon-192.png">\n<link rel="apple-touch-icon" href="icon-192.png">', 1)
          open('rasd/index.html', 'w', encoding='utf-8').write(s)
          n = json.load(open('rasd-src/notes.json', encoding='utf-8'))
          v = {"code": code, "name": name, "apk": "https://mahmoudbassiuoni.github.io/rasd/rasd.apk",
               "size": os.path.getsize('rasd/rasd.apk'), "notes": n.get('notes', ''), "notes_en": n.get('notes_en', '')}
          json.dump(v, open('rasd/version.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print(v)
          PY
          git config user.name "rasd-build"
          git config user.email "actions@github.com"
          git add rasd
          git commit -m "Rasd $NAME (auto build)" || { echo "nothing changed"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
          # pushes made by this workflow don't start a Pages build on their own
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
      - name: Send update push
        if: steps.sec.outputs.ok == 'true'
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
        run: |
          if [ -z "$FCM_SA" ]; then echo "FCM_SA not set — skipping"; exit 0; fi
          pip install -q google-auth requests
          python3 - <<'PY'
          import json, os, time, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          v = json.load(open('rasd/version.json'))
          t0 = time.time()
          for i in range(120):
              try:
                  live = requests.get('https://mahmoudbassiuoni.github.io/rasd/version.json?t=%d' % time.time(), timeout=15).json()
                  h = requests.head('https://mahmoudbassiuoni.github.io/rasd/rasd.apk?t=%d' % time.time(), timeout=15, allow_redirects=True)
                  if live.get('code') == v['code'] and int(h.headers.get('Content-Length', 0)) == v['size']:
                      print('live after %.0f s' % (time.time() - t0)); break
              except Exception as e:
                  print('wait:', e)
              time.sleep(4)
          else:
              raise SystemExit('site did not update in time — no push sent')
          sa = json.loads(os.environ['FCM_SA'])
          cred = service_account.Credentials.from_service_account_info(sa, scopes=['https://www.googleapis.com/auth/firebase.messaging'])
          cred.refresh(Request())
          notes = v['notes'].replace('• ', '').strip() or 'افتح رصد ونزّل التحديث'
          # notification payload: Android shows it right away even if the app is closed (like Daftari)
          msg = {'message': {'topic': 'rasd-updates',
                 'notification': {'title': 'تحديث جديد لرصد %s' % v['name'], 'body': notes,
                                  'image': 'https://mahmoudbassiuoni.github.io/rasd/update-banner.png'},
                 'data': {'code': str(v['code']), 'name': v['name'], 'notes': v['notes'], 'notes_en': v['notes_en'], 'test': '', 'upd': '1'},
                 'android': {'priority': 'high', 'notification': {'channel_id': 'rasd_updates', 'color': '#2F6BFF', 'icon': 'ic_stat',
                                                               'image': 'https://mahmoudbassiuoni.github.io/rasd/update-banner.png',
                                                               'notification_priority': 'PRIORITY_HIGH'}}}}
          r = requests.post('https://fcm.googleapis.com/v1/projects/%s/messages:send' % sa['project_id'],
                            headers={'Authorization': 'Bearer ' + cred.token}, json=msg, timeout=30)
          print(r.status_code, r.text[:200]); r.raise_for_status()
          PY
