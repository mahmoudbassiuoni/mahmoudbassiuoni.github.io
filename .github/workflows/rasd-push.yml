# Sends an instant "new update" push to every phone with Rasd
# whenever rasd/version.json changes. Uses the same FCM_SA secret as Daftari
# (both apps are in the same Firebase project). Without it, this step is skipped.
name: Notify new Rasd version
on:
  workflow_dispatch:   # the build workflow (rasd-build.yml) now sends the push itself
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Send push to topic "rasd-updates"
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
        run: |
          if [ -z "$FCM_SA" ]; then echo "FCM_SA secret not set — skipping"; exit 0; fi
          pip install -q google-auth requests
          python3 - <<'PY'
          import json, os, subprocess, time, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          v = json.load(open('rasd/version.json'))
          test = os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          try:
              old = json.loads(subprocess.check_output(['git', 'show', 'HEAD~1:rasd/version.json']).decode())
          except Exception:
              old = {}
          if old.get('code') == v.get('code') and not test:
              print('version code unchanged — no notification'); raise SystemExit(0)
          # wait until the new version is really live on the site
          size = os.path.getsize('rasd/rasd.apk')
          for i in range(60):
              try:
                  live = requests.get('https://mahmoudbassiuoni.github.io/rasd/version.json?t=%d' % time.time(), timeout=15).json()
                  h = requests.head('https://mahmoudbassiuoni.github.io/rasd/rasd.apk?t=%d' % time.time(), timeout=15, allow_redirects=True)
                  if live.get('code') == v.get('code') and int(h.headers.get('Content-Length', 0)) == size:
                      print('live after', i * 15, 's'); break
              except Exception as e:
                  print('wait:', e)
              time.sleep(15)
          time.sleep(20)
          sa = json.loads(os.environ['FCM_SA'])
          cred = service_account.Credentials.from_service_account_info(sa, scopes=['https://www.googleapis.com/auth/firebase.messaging'])
          cred.refresh(Request())
          # data-only message: the app checks the version itself and shows the notification
          msg = {'message': {
              'topic': 'rasd-updates',
              'data': {'code': str(v.get('code', '')), 'name': str(v.get('name', '')),
                       'notes': v.get('notes', ''), 'notes_en': v.get('notes_en', ''), 'test': '1' if test else ''},
              'android': {'priority': 'high'}}}
          r = requests.post('https://fcm.googleapis.com/v1/projects/%s/messages:send' % sa['project_id'],
                            headers={'Authorization': 'Bearer ' + cred.token}, json=msg, timeout=30)
          print(r.status_code, r.text[:300]); r.raise_for_status()
          PY
