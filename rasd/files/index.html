<style>
/* VOICE: the LoMag layout people already know, redrawn clean and modern
   IDEA: a scanner handset's home screen — big paper-sheet tiles with coloured badges
   PICTURE: the 3x2 grid of illustrated sheet icons under a wordmark banner
   COLOUR and TYPE: white work surface, navy #13235b wordmark, scan red #e63946, badge colours per action; Outfit + IBM Plex Sans Arabic, Plex Mono for codes
   LAYOUT: banner, tile grid, small bottom row; inner pages = plain app bar + list rows; centered dialogs */
:root{color-scheme:light dark;--bg:light-dark(#f6f7fb,#0b1020);--card:light-dark(#fff,#141b2d);--ink:light-dark(#13235b,#eef2fb);--txt:light-dark(#1d2433,#e7ebf3);--mute:light-dark(#6b7486,#9aa4b8);--line:light-dark(#e6e9f0,#252e44);--acc:light-dark(#2f6bff,#6f93ff);--acc2:light-dark(#eaf0ff,#1a2550);--red:#e63946;--warn:#f5a524;--warnbg:light-dark(#fff6e5,#2b2110);--bad:#e5484d;--ok:#16a34a;--pg1:light-dark(#ffffff,#26304a);--pg2:light-dark(#eef1f6,#1b2338);--pgs:light-dark(#d3d9e4,#3a4562)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-c=ocean]{--acc:light-dark(#0f9488,#3fd6c3);--acc2:light-dark(#e2f6f3,#0d3330);--ink:light-dark(#0b3b3a,#e6fbf8);--bg:light-dark(#f3f8f7,#08130f)}

:root[data-c=sunset]{--acc:light-dark(#e8590c,#ff9a4d);--acc2:light-dark(#fff0e4,#3a1e0b);--ink:light-dark(#4a2108,#fff1e6);--bg:light-dark(#fbf6f2,#140c06)}
:root[data-c=rose]{--acc:light-dark(#d6336c,#f783ac);--acc2:light-dark(#fdebf2,#3d1022);--ink:light-dark(#4a1028,#ffe9f1);--bg:light-dark(#fbf4f7,#150810)}
:root[data-c=graphite]{--acc:light-dark(#334155,#cbd5e1);--acc2:light-dark(#eceff3,#1f2633);--ink:light-dark(#0f172a,#f1f5f9);--bg:light-dark(#f4f5f7,#0b0d12)}
.btn.pri{color:light-dark(#fff,#0b1020)}
.nmw{margin-top:12px}

.cchip.on{border-color:var(--cc,var(--acc));background:var(--cc,var(--acc));color:#fff}.cchip.on i{background:#fff}.cchip.on b{background:#ffffff33;color:#fff}
.cchip.add{color:var(--acc);border-style:dashed}.cchip.add svg.i{width:18px;height:18px}
.cpk{display:flex;flex-wrap:wrap;gap:8px}
.cnew{display:flex;gap:8px;margin-top:10px}.cnew.hide{display:none}
.ctag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent);border-radius:99px;padding:0 8px;margin-inline-end:6px}
.crow{display:flex;align-items:center;gap:10px;margin-top:10px}.crow i{width:14px;height:14px;border-radius:50%;flex:none}.crow .f{height:46px}
.dd{position:relative;width:100%}
.dd.sm{width:auto;min-width:112px}
.ddb{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;font-weight:600;color:var(--ink);text-align:start;box-shadow:0 2px 6px #13235b10}
.dd.sm .ddb{height:48px;font:700 17px "IBM Plex Mono",monospace}

.dd.open .ddb{border-color:var(--acc);border-radius:14px 14px 0 0;box-shadow:none}.dd.open .ddb::after{transform:rotate(225deg) translate(-2px,-1px);border-color:var(--acc)}

.ddl::-webkit-scrollbar{display:none}

.aic.ua{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(#6aa8ff,#2459e8);flex:none}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2>div{min-width:0}.g2 .f{width:100%}

.ib.ra{width:40px;height:40px}.ib.ra span{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff}.ib.ra svg.i{width:18px;height:18px}

.sw.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}

*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.55 "IBM Plex Sans Arabic",Outfit,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=ltr] .flip{transform:scaleX(-1)}
.wrap{max-width:720px;margin:auto}
/* banner */
.banner{background:var(--card);padding:calc(14px + env(safe-area-inset-top)) 18px 18px;border-bottom:1px solid var(--line)}
.banner .in{display:flex;align-items:center;gap:16px}
.qr{width:72px;height:72px;flex:none}
.wm{flex:1}
.wm b{display:block;font:800 46px/1 Outfit,"IBM Plex Sans Arabic",sans-serif;color:var(--ink);letter-spacing:-.5px}
.wm .ln{height:3px;background:linear-gradient(90deg,var(--red),#ff8a8a 70%,transparent);border-radius:3px;margin:8px 0 6px;position:relative}
[dir=rtl] .wm .ln{background:linear-gradient(270deg,var(--red),#ff8a8a 70%,transparent)}
.wm .ln::after{content:"";position:absolute;top:-4px;inset-inline-end:18%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--red),0 0 14px 4px #e6394699}
.wm span{font:700 14px/1 Outfit,"IBM Plex Sans Arabic",sans-serif;color:var(--red);letter-spacing:.32em}
[dir=rtl] .wm span{letter-spacing:.05em;font-size:16px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 6px;padding:18px 10px 8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px 10px;border-radius:20px;transition:background .15s,transform .12s}
.tile:active{transform:scale(.95);background:var(--acc2)}
@media(hover:hover){.tile:hover{background:var(--card)}}
.tile svg{width:min(26vw,128px);height:auto;aspect-ratio:1;filter:drop-shadow(0 8px 10px #13235b1f)}
.tile b{font-weight:600;font-size:clamp(14px,3.8vw,17px);line-height:1.3;text-align:center;color:var(--txt)}
.lastbar{margin:0 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.lastbar .g{flex:1;overflow:hidden}
.lastbar b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minirow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center;gap:4px;border-top:1px solid var(--line);margin-top:16px;padding:16px 10px 40px}
.mini{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;width:100%;padding:6px 2px;font-size:13px;text-align:center;line-height:1.3;border-radius:16px;color:var(--mute);font-weight:500}
.bkdot{position:absolute;top:-5px;inset-inline-end:-5px;width:16px;height:16px;border-radius:50%;border:3px solid var(--card);background:#9aa4b8;box-sizing:content-box;box-shadow:0 1px 3px #0003}.mini .bkdot{top:-1px;inset-inline-end:-1px}
.bkdot.g{background:#16a34a}.bkdot.r{background:#e5484d}.bkdot.b{background:#f5a524}
.mini .c{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 18px Outfit,sans-serif}
/* app bar */
.bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top) 6px 0;box-shadow:0 4px 16px -12px #13235b55}
.bar .in{display:flex;align-items:center;gap:2px;min-height:62px}
.bar h1{flex:1;margin:0 6px;font-size:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.ib{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--ink)}
.ib:active{background:var(--acc2)}
.ib.tint{color:#fff}
.ib.tint span{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.ib.tint svg.i{width:21px;height:21px}
main{padding:8px 0 120px}
.sum{display:flex;gap:16px;padding:10px 18px;color:var(--mute);font-size:14px;border-bottom:1px solid var(--line);background:var(--card)}
.sum b{color:var(--ink);font-size:16px}
/* rows */
.rowi{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line);background:var(--card);width:100%;text-align:start;min-height:72px}
[dir=rtl] .rowi{padding:10px 14px 10px 12px}

<script type="module">
const P={"up": "<path d=\"M12 20V9M7 14l5-5 5 5M5 4h14\"/>", "dl": "<path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\"/>", "file": "<path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"/><path d=\"M14 3v5h5M9 13h6M9 17h4\"/>", "x": "<path d=\"M6 6l12 12M18 6L6 18\"/>", "chev": "<path d=\"M15 6l-6 6 6 6\"/>", "search": "<circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4.5-4.5\"/>", "user": "<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7\"/>", "logout": "<path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3\"/><path d=\"M10 8l-4 4 4 4M6 12h10\"/>", "restore": "<path d=\"M4 12a8 8 0 1 0 2.3-5.6L4 8.7\"/><path d=\"M4 4v4.7h4.7M12 8v4l3 2\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20c0-3.8 2.9-6 6.5-6s6.5 2.2 6.5 6\"/><path d=\"M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.3.6 3.5 2.6 3.5 6\"/>", "scan": "<path d=\"M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6\"/>"};
const ic=k=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
document.querySelectorAll('button,span').forEach(e=>{e.innerHTML=e.innerHTML.replace(/ICON_(\w+)/g,(m,k)=>ic(k))});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const fmt=n=>Number(n||0).toLocaleString('ar-EG');

const tm=s=>{if(!s)return '';const [h,m]=s.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})};
const when=x=>x?new Date(x).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
const FBC={apiKey:'AIzaSyBbgXH2SAdILnf0mDpinMsY3nwBq0g_oV4',authDomain:'daftari-515600.firebaseapp.com',projectId:'daftari-515600',storageBucket:'daftari-515600.firebasestorage.app',messagingSenderId:'539562884900',appId:'1:539562884900:web:f06e4ff72ae49e17067db1'},V='11.0.2';

const [A,AU,FS]=await Promise.all([import(u('app')),import(u('auth')),import(u('firestore'))]);
const app=A.initializeApp(FBC,'rasdweb'),auth=AU.getAuth(app),db=FS.getFirestore(app);
let all=[],kf='',qv='',unsub=null;
const gate=(st,email)=>{$('#app2').classList.add('hide');$('#gate2').classList.remove('hide');
  const M={in:['الملفات المرفوعة','سجّل دخول بحساب جوجل المسموح له يشوف الملفات'],wait:['لحظة…','بنجيب الملفات'],no:['الحساب ده مش مسموح له','الإيميل ده مش ضمن اللي يقدروا يشوفوا الملفات. اطلب من صاحب التطبيق يضيفك.'],err:['حصلت مشكلة','اتأكد من النت وجرّب تاني']}[st];
  $('#gT').textContent=M[0];$('#gS').textContent=M[1];$('#gM').textContent=email||'';$('#gM').classList.toggle('hide',!email);
  $('#gB').classList.toggle('hide',st==='wait');$('#gBt').textContent=st==='no'?'جرّب حساب تاني':'الدخول بحساب جوجل';$('#gO').classList.add('hide');
  $('#gR').classList.toggle('hide',st!=='no');$('#gR').disabled=false;$('#gN').textContent='';
  if(st==='no'&&auth.currentUser)FS.getDoc(FS.doc(db,'rasd_reqs','web_'+auth.currentUser.email.toLowerCase())).then(d=>{if(d.exists()){$('#gR').classList.add('hide');$('#gN').textContent='طلبك متبعت ومستني موافقة صاحب التطبيق. أول ما يوافق الصفحة هتفتح لوحدها.'}}).catch(()=>{})};
$('#gR').onclick=async()=>{const u=auth.currentUser;if(!u)return;$('#gR').disabled=true;const e=u.email.toLowerCase();
  try{await FS.setDoc(FS.doc(db,'rasd_reqs','web_'+e),{e,k:'web',at:Date.now()});$('#gR').classList.add('hide');$('#gN').textContent='طلبك اتبعت ✓ أول ما صاحب التطبيق يوافق الصفحة هتفتح لوحدها.';watchApproval(u)}
  catch(err){console.error(err);$('#gR').disabled=false;$('#gN').textContent='معرفناش نبعت الطلب، جرّب تاني'}};
let wT=null;function watchApproval(u){clearInterval(wT);wT=setInterval(()=>{if(auth.currentUser!==u)return clearInterval(wT);FS.getDocs(FS.collection(db,'rasd_uploads')).then(()=>{clearInterval(wT);location.reload()}).catch(()=>{})},15000)}
async function signIn(){try{const p=new AU.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await AU.signInWithPopup(auth,p)}catch(e){if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')gate('err')}}
$('#gB').onclick=async()=>{if(auth.currentUser)await AU.signOut(auth);signIn()};
$('#out').onclick=()=>AU.signOut(auth);
AU.onAuthStateChanged(auth,user=>{if(unsub){unsub();unsub=null}
  if(!user)return gate('in');gate('wait',user.email);
  unsub=FS.onSnapshot(FS.collection(db,'rasd_uploads'),snap=>{all=snap.docs.map(d=>({id:d.id,...d.data()}));$('#me').textContent=user.email;$('#gate2').classList.add('hide');$('#app2').classList.remove('hide');draw()},
    err=>{console.error(err);const no=String(err.code).includes('permission');gate(no?'no':'err',user.email);if(no)watchApproval(user)})});
const ts=x=>x.at&&x.at.toMillis?x.at.toMillis():0;
const secLbl=x=>x.k?['Sec '+x.sec,x.u,x.late?'Late':''].filter(Boolean).join(' · '):x.name;
function groups(xs){const g={};for(const x of xs){const key=x.k?x.k+' '+x.n:'~';(g[key]=g[key]||[]).push(x)}
  return Object.keys(g).sort((a,b)=>a==='~'?1:b==='~'?-1:a.slice(0,2).localeCompare(b.slice(0,2))||(+a.slice(3))-(+b.slice(3))).map(k=>[k,g[k].sort((a,b)=>String(a.sec).localeCompare(String(b.sec),undefined,{numeric:true})||(a.late-b.late)||String(a.u).localeCompare(String(b.u)))])}
function filtered(){const q=qv.trim().toLowerCase();return all.filter(x=>(!kf||x.k===kf)&&(!q||[x.name,x.ta,x.hall,x.by,...(x.codes||[]).map(c=>c.c),...(x.names||[]).map(n=>n.n)].some(v=>String(v||'').toLowerCase().includes(q))))}
function draw(){const xs=filtered();
  $('#sF').textContent=fmt(all.length);$('#sC').textContent=fmt(all.reduce((s,x)=>s+(x.codes||[]).length,0));$('#sN').textContent=fmt(all.reduce((s,x)=>s+(x.names||[]).length,0));
  $('#sub').innerHTML=`<span class="live"><i></i> بتتحدّث لوحدها</span>`;
  $('#list').innerHTML=!all.length?'<div class="empty">لسه محدش رفع حاجة</div>':!xs.length?'<div class="empty">مفيش نتايج</div>':groups(xs).map(([k,g])=>`<div class="gh"><h2 class="sh" dir="ltr">${k==='~'?'ملفات تانية':esc(k)} · ${fmt(g.length)}</h2><button class="btn" data-g="${esc(k)}">${ic('dl')} حمّل الكل Excel</button></div>
   <div class="grp">${g.map(x=>`<button class="rowi" data-o="${esc(x.id)}" style="width:100%;text-align:start"><span class="aic" style="background:linear-gradient(${x.k==='HW'?'#a98bff,#6a3df0':'#3fd6c3,#0f9488'})">${ic('file')}</span><div class="g"><h3 dir="ltr" style="text-align:start">${esc(secLbl(x))}</h3>
   <div class="meta">${esc(x.ta||'')} · ${esc(dayN(x.date))}</div><div class="meta">صالة ${esc(x.hall||'')} · ${esc(tm(x.from))} – ${esc(tm(x.to))} · ${fmt((x.codes||[]).length)} كود · ${fmt((x.names||[]).length)} اسم</div></div>${ic('chev')}</button>`).join('')}</div>`).join('')}
$('#q').oninput=e=>{qv=e.target.value;draw()};
document.querySelectorAll('.fchips button').forEach(b=>b.onclick=()=>{kf=b.dataset.k;document.querySelectorAll('.fchips button').forEach(x=>x.classList.toggle('on',x===b));draw()});
const tbl=(h,rows,mono)=>rows.length?`<table class="tb"><thead><tr><th>${h}</th><th style="text-align:end">الكمية</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="${mono?'mono':''}" dir="auto">${esc(r[0])}</td><td class="n">${esc(r[1]??'')}</td></tr>`).join('')}</tbody></table>`:'';
function open(id){const x=all.find(y=>y.id===id);if(!x)return;$('#mT').innerHTML=`<span dir="ltr">${esc(x.name)}</span>`;
  const c=(x.codes||[]).map(r=>[r.c,r.q]),n=(x.names||[]).map(r=>[r.n,r.q]);
  $('#mB').innerHTML=`<dl class="kv"><dt>المعيد</dt><dd>${esc(x.ta||'')}</dd><dt>التاريخ</dt><dd>${esc(dayN(x.date))}</dd><dt>الصالة رقم</dt><dd>${esc(x.hall||'')}</dd><dt>الميعاد</dt><dd>${esc(tm(x.from))} – ${esc(tm(x.to))}</dd><dt>رفعه</dt><dd dir="ltr" style="text-align:start">${esc(x.by||'')}</dd><dt>اترفع</dt><dd>${when(ts(x))}</dd></dl>
  <button class="btn pri full" style="margin-top:14px" data-x="${esc(id)}">${ic('dl')} حمّل Excel</button>
  <div class="tw">${tbl('الكود',c,true)}${tbl('الاسم',n,false)}</div>`;$('#mx').classList.add('on')}
$('#mX').onclick=()=>$('#mx').classList.remove('on');$('#mx').onclick=e=>{if(e.target.id==='mx')$('#mx').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#mx').classList.remove('on')});
const needX=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='../lib/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const aoa=x=>{const c=x.codes||[],n=x.names||[],h=['الكود','الكمية'];if(n.length)h.push('الاسم','الكمية');const a=[h];for(let i=0;i<Math.max(c.length,n.length);i++){const r=[c[i]?c[i].c:'',c[i]?c[i].q??'':''];if(n.length)r.push(n[i]?n[i].n:'',n[i]?n[i].q??'':'');a.push(r)}return a};
async function xl(xs,fname){await needX();const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};const used=new Set();
  for(const x of xs){const ws=XLSX.utils.aoa_to_sheet(aoa(x));ws['!cols']=[{wch:24},{wch:12},{wch:24},{wch:12}];let sn=(x.k?secLbl(x).replace(/ · /g,' '):x.name).replace(/[\\\/?*\[\]:]/g,' ').slice(0,31)||'Sheet';let i=2;while(used.has(sn))sn=sn.slice(0,28)+' '+i++;used.add(sn);XLSX.utils.book_append_sheet(wb,ws,sn)}
  XLSX.writeFile(wb,fname.replace(/[\\/:*?"<>|]/g,'_')+'.xlsx')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-o],[data-x],[data-g]');if(!b)return;const d=b.dataset;
  if(d.o)return open(d.o);if(d.x){const x=all.find(y=>y.id===d.x);return xl([x],x.name)}
  if(d.g){const g=groups(filtered()).find(([k])=>k===d.g);if(g)xl(g[1],(d.g==='~'?'Rasd':d.g)+' - '+new Date().toISOString().slice(0,10))}});
