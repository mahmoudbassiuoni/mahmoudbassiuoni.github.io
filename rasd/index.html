async function importFile(file,cat,many){try{await needX()}catch(e){}if(!window.XLSX){toast(t('needNet'),'bad');return 0}
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}).filter(r=>r.some(c=>String(c).trim()!==''));
    if(!rows.length)throw 0;
    const head=rows[0].map(c=>String(c).trim().toLowerCase());const find=re=>head.findIndex(h=>re.test(h));
    const isHead=head.some(h=>/كود|code|barcode|كمية|qty|quantity|سعر|price/.test(h));
    let ci=find(/الكود|^كود|code|barcode/),qi=find(/كمية|qty|quantity|amount/),pi=find(/سعر|price/),si=find(/سيريال|serial/),ni=find(/وصف|desc|note|اسم الصنف|item/);
    if(ci<0){ci=0;if(!isHead&&rows[0].length>1&&/^\d+$/.test(String(rows[0][0]))&&!/^\d+$/.test(String(rows[0][1])))ci=1}
    const map=new Map();const now=Date.now();
    rows.slice(isHead?1:0).forEach((r,i)=>{const code=String(r[ci]??'').trim();if(!code)return;const q=qi>=0?num(r[qi]):1;const pr=pi>=0?num(r[pi]):null;const sr=si>=0?String(r[si]).trim():'';const k=code+(sr?'|'+sr:'');
      const o=map.get(k);if(o){o.qty=(o.qty||0)+(isNaN(q)||q==null?1:q);return}

async function finishFind(code){await stopScan(true);gq=code;view='browse';render();scrollTo(0,0);const any=D.files.some(f=>f.records.some(r=>r.code===code||r.serial===code));if(!any)toast(t('notFound'),'bad')}
async function stopScan(keepView){clearTimeout(rt);clearTimeout(loopT);scanning=false;paused=false;
  try{if(torchOn&&track)await track.applyConstraints({advanced:[{torch:false}]})}catch(e){}
  try{vid.pause()}catch(e){}vid.classList.remove('live');torchOn=false;$('#torchBtn').classList.remove('on');
  clearTimeout(keepT);const s0=stream;keepT=setTimeout(()=>{if(stream===s0&&!scanning){try{s0&&s0.getTracks().forEach(x=>x.stop())}catch(e){}stream=null;track=null;vid.srcObject=null}},12000);
  const wasFind=findMode;findMode=false;$('#scan').classList.remove('on');if(keepView===true)return;if(wasFind){view='browse';return render()}view='preview';render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!scanning&&stream){clearTimeout(keepT);try{stream.getTracks().forEach(x=>x.stop())}catch(e){}stream=null;track=null;vid.srcObject=null}});
async function toggleTorch(){if(!track)return;try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});$('#torchBtn').classList.toggle('on',torchOn)}catch(e){torchOn=false;toast(t('torchNA'),'bad')}}

/* ---------- backup: Google Drive (same way as دفتري) ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const NAT=window.RasdNative||null,isNative=!!NAT;
const inArtifact=/claude|anthropic/i.test(location.hostname)||location.protocol==='file:';
const GSC='https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email',GAPI='https://www.googleapis.com';
const GCID='539562884900-qaoe259426nuptoo34dfd17db8a9ebrl.apps.googleusercontent.com';
const gOK=()=>isNative||(location.protocol==='https:'&&!inArtifact);
const gtok=()=>{const x=LS.get('rasd_gtok');return x&&x.exp>Date.now()+60000?x.at:null};
const gAuto=()=>gOK()&&!!LS.get('rasd_gauto');
let gBusy=false,gAgain=false,gTimer=0,gRetry=0;
window.__nativeTok=(at,sec)=>{LS.set('rasd_gtok',{at,exp:Date.now()+(+sec||3600)*1000});LS.set('rasd_gauto',true);const f=window.__tokWait;window.__tokWait=null;if(f)f(true);else{toast(t('gLinked'),'ok');driveBackup(false)}};
window.__nativeTokErr=(m)=>{const f=window.__tokWait;window.__tokWait=null;if(f)f(false);if(m&&m!=='silent')toast(m==='cancel'?t('gCancel'):m,'bad');bkIcon()};
function natToken(interactive){return new Promise(res=>{window.__tokWait=res;try{NAT.authorize(!!interactive)}catch(e){window.__tokWait=null;res(false)}setTimeout(()=>{if(window.__tokWait===res){window.__tokWait=null;res(false)}},interactive?120000:20000)})}
function gAuth(silent){if(!gOK())return toast(t('gNA'),'bad');
  if(isNative){natToken(!silent).then(ok=>{if(ok){toast(t('gLinked'),'ok');driveBackup(false)}});return}
  const st=uid();LS.set('rasd_gstate',{st,silent:!!silent,view});
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:GCID,redirect_uri:location.origin+location.pathname,response_type:'token',scope:GSC,include_granted_scopes:'true',state:st,prompt:silent?'none':'consent'})}
async function gfetch(u,o={}){const tk=gtok();if(!tk)throw new Error('auth');const r=await fetch(u,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+tk}});if(r.status===401){LS.set('rasd_gtok',null);throw new Error('auth')}if(!r.ok)throw new Error('http '+r.status);return r}
async function gList(){const r=await gfetch(GAPI+'/drive/v3/files?spaces=appDataFolder&pageSize=100&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime,size)');return ((await r.json()).files||[]).filter(f=>/^rasd-/.test(f.name))}
async function gPut(name,data,id){if(id)return gfetch(GAPI+'/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:data});
  const b='rasd'+uid(),body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name,parents:['appDataFolder']})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+data+'\r\n--'+b+'--';
  return gfetch(GAPI+'/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})}
async function driveBackup(manual){
  if(!gOK()){if(manual)toast(t('gNA'),'bad');return}
  if(!gtok()){if(isNative){const ok=await natToken(!!manual);if(!ok)return bkIcon()}else{if(manual)gAuth(false);return bkIcon()}}
  if(gBusy){gAgain=true;return}gBusy=true;gAgain=false;bkIcon();if(manual)toast(t('gSaving'));
  try{const files=await gList(),data=bkData(),dn='rasd-'+today()+'.json';
    await gPut('rasd-backup.json',data,(files.find(f=>f.name==='rasd-backup.json')||{}).id);
    await gPut(dn,data,(files.find(f=>f.name===dn)||{}).id);
    const old=files.filter(f=>/^rasd-\d{4}-\d\d-\d\d\.json$/.test(f.name)&&f.name!==dn).sort((a,b)=>b.name.localeCompare(a.name)).slice(6);
    for(const f of old){try{await gfetch(GAPI+'/drive/v3/files/'+f.id,{method:'DELETE'})}catch(e){}}
    LS.set('rasd_gbk',Date.now());LS.set('rasd_lastbk',Date.now());LS.set('rasd_gdirty',0);LS.set('rasd_gerr',null);gRetry=0;if(manual)toast(t('gSaved'),'ok')}
  catch(e){if(e.message==='auth'){if(manual)gAuth(false)}else{LS.set('rasd_gerr',Date.now());if(manual)toast(t('gFail'),'bad');if(gRetry<6){const w=[30,60,120,300,600,900][gRetry++]*1000;setTimeout(()=>{if(LS.get('rasd_gdirty'))driveBackup(false)},w)}}}
  finally{gBusy=false;bkIcon();if($('#bkBox'))bkSheet();if(gAgain){gAgain=false;gSchedule(1500)}}}
function gSchedule(ms){if(!gAuto())return;clearTimeout(gTimer);gTimer=setTimeout(()=>driveBackup(false),ms||4000)}
function gTouch(){LS.set('rasd_gdirty',1);bkIcon();gSchedule()}
window.addEventListener('online',()=>{if(LS.get('rasd_gdirty'))gSchedule(1500)});
function ago(x){const s=(Date.now()-x)/1000,rtf=new Intl.RelativeTimeFormat(loc(),{numeric:'auto'});if(s<60)return rtf.format(0,'second');if(s<3600)return rtf.format(-Math.round(s/60),'minute');if(s<86400)return rtf.format(-Math.round(s/3600),'hour');return rtf.format(-Math.round(s/86400),'day')}
function bkStatus(){const lb=LS.get('rasd_lastbk'),gb=LS.get('rasd_gbk'),dt=!!LS.get('rasd_gdirty');
  if(gAuto()){if(!gb)return{c:'r',t:t('bkOnDrive'),s:t('bkNever')};return{c:gBusy?'b':dt?'r':'g',t:t('bkOnDrive'),s:dt?t('bkDirty')+' · '+t('bkLast',{a:ago(gb)}):t('bkLast',{a:ago(gb)})}}
  return{c:lb?(Date.now()-lb<7*864e5?'g':'r'):'',t:t('bkOff'),s:lb?t('bkLast',{a:ago(lb)}):t('bkNever')}}
const bkBadge=()=>`<span class="fic" style="width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(#a98bff,#6a3df0);color:#fff;display:grid;place-items:center;position:relative">${ic('cloud')}<i class="bkdot ${bkStatus().c}"></i></span>`;
function bkIcon(){const d=$('#bkDot');if(d)d.className='bkdot '+(gBusy?'b':bkStatus().c);const l=$('#bkLine');if(l){const s=bkStatus();l.textContent=s.t+' · '+s.s}}
function bkSheet(){const st=bkStatus(),can=gOK(),on=gAuto(),tk=!!gtok()||isNative,pre=!!LS.get('rasd_pre');
  const row=(a,k,g,b,sm)=>`<button class="arow" data-act="${a}"><span class="aic" style="background:linear-gradient(${g})">${ic(k)}</span><span class="g"><b>${b}</b><small>${sm}</small></span><span class="chev">${ic('chev')}</span></button>`;
  sheet(`<h2>${t('bk')}</h2><div class="sb" id="bkBox">
  <div class="bkst">${bkBadge()}<div class="g"><b>${st.t}</b><div class="meta">${st.s}</div></div></div>
  ${can?`<label class="swrow"><span class="g"><b>${t('bkAuto')}</b><small>${t('bkAutoSub')}</small></span><input type="checkbox" class="sw2" role="switch" data-act="gAutoT" ${on?'checked':''}></label>`:`<div class="meta" style="margin-top:12px">${t('gNA')}</div>`}
  <div class="alist">${can?(tk||on?row('gNow','up','#3ddc84,#139a4b',t('gNow'),t('gNowSub')):row('gLink','cloud','#6aa8ff,#2459e8',t('gLink'),t('gLinkSub')))+row('gRestore','restore','#ffc145,#ef8a00',t('gRestore'),t('gRestoreSub')):''}
  ${row('backup','dl','#3fd6c3,#0f9488',t('devSave'),t('devSaveSub'))}${row('bkShare','share','#6aa8ff,#2459e8',t('bkShare'),t('bkShareSub'))}${row('restore','imp','#a98bff,#6a3df0',t('fileRestore'),t('fileRestoreSub'))}
  ${pre?row('undoRs','restore','#94a3b8,#475569',t('undoRs'),''):''}</div>
  <button class="btn full" style="margin-top:14px" data-act="close">${t('ok')}</button></div>`)}
async function gRestoreList(){if(!gtok()&&!isNative)return gAuth(false);if(!gtok()&&isNative&&!(await natToken(true)))return;
  sheet(`<h2>${t('gFiles')}</h2><div class="sb"><div class="empty" style="padding:30px">${t('loading')}</div></div>`);
  try{const fs=(await gList()).filter(f=>f.name==='rasd-backup.json'||/^rasd-\d{4}-\d\d-\d\d\.json$/.test(f.name));
    $('#sheet .sb').innerHTML=fs.length?fs.map(f=>`<button class="rowi" style="border-radius:12px" data-gf="${esc(f.id)}" data-gn="${esc(f.name)}">${xlIcon.replace('url(#gGreen)','url(#gViolet)')}<div class="g"><h3>${f.name==='rasd-backup.json'?t('latestCopy'):t('dayCopy',{d:esc(f.name.slice(5,15))})}</h3><div class="meta">${when(Date.parse(f.modifiedTime))} · ${fmt(Math.ceil((+f.size||0)/1024))} KB</div></div>${ic('chev')}</button>`).join('')+`<button class="btn full" style="margin-top:10px" data-act="bk">${t('cancel')}</button>`:`<div class="empty" style="padding:30px">${t('gEmpty')}</div><button class="btn full" data-act="bk">${t('cancel')}</button>`}
  catch(e){if(e.message==='auth')return gAuth(false);toast(t('gFail'),'bad');bkSheet()}}
async function gPick(id){try{const r=await gfetch(GAPI+'/drive/v3/files/'+id+'?alt=media');const d=await r.json();if(!bkOK(d))throw 0;askRestore(d)}catch(e){toast(t('gGetFail'),'bad')}}
const bkOK=d=>d&&typeof d==='object'&&Array.isArray(d.files)&&d.files.every(f=>f&&f.id&&typeof f.name==='string'&&Array.isArray(f.records));
function askRestore(d){const n=d.files.length,c=d.files.reduce((s,f)=>s+f.records.length,0);
  confirmBox(`${t('rsQ')}<br><br><b>${fmt(n)}</b> ${L()==='en'?'files':'ملف'} · <b>${fmt(c)}</b> ${t('codes')}${d.savedAt?' · '+when(d.savedAt):''}`,t('rsDo'),()=>{LS.set('rasd_pre',{t:Date.now(),d:JSON.parse(JSON.stringify(D))});D={files:d.files,cats:Array.isArray(d.cats)?d.cats:[],last:d.last||null,set:{...DEF,...(d.set||{})}};cur=null;save();view='home';render();toast(t('rsOk'),'ok')})}
function undoRestore(){const p=LS.get('rasd_pre');if(!p)return;const now=JSON.parse(JSON.stringify(D));D={...p.d,cats:Array.isArray(p.d.cats)?p.d.cats:[],set:{...DEF,...p.d.set}};LS.set('rasd_pre',{t:Date.now(),d:now});cur=null;save();closeSheet();view='home';render();toast(t('undone'),'ok')}
(function gReturn(){const h=location.hash;if(!/access_token=|error=/.test(h))return;const q2=new URLSearchParams(h.slice(1)),st=LS.get('rasd_gstate')||{};
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!st.st||q2.get('state')!==st.st)return;LS.set('rasd_gstate',null);
  if(q2.get('access_token')){LS.set('rasd_gtok',{at:q2.get('access_token'),exp:Date.now()+(+q2.get('expires_in')||3600)*1000});LS.set('rasd_gauto',true);setTimeout(()=>{toast(t('gLinked'),'ok');driveBackup(false)},900)}
  else if(st.silent)LS.set('rasd_gsilfail',Date.now());
  else setTimeout(()=>toast(t('gCancel'),'bad'),900)})();
function gStartup(){if(!gAuto()||!LS.get('rasd_gdirty'))return;if(gtok())return gSchedule(2500);if(isNative)return natToken(false).then(ok=>ok&&driveBackup(false));
  const now=Date.now();if(navigator.onLine!==false&&now-(+LS.get('rasd_gsilfail')||0)>6*36e5&&now-(+LS.get('rasd_gsil')||0)>12*36e5){LS.set('rasd_gsil',now);gAuth(true)}}

/* events */
function syncDraft(){if(!draft||!$('#sNote'))return;draft.note=$('#sNote').checked;draft.sound=$('#sSound').checked;draft.vib=$('#sVib').checked;draft.ext=$('#sExt').dataset.val;draft.formats=[...document.querySelectorAll('[data-fmt]')].filter(c=>c.checked).map(c=>c.dataset.fmt)}
function go(v){view=v;q='';gq='';selMode=false;sel.clear();if(v==='preview')cur=D.last;if(v!=='settings')draft=null;render();scrollTo(0,0)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-open]');if(!b)return;const d=b.dataset;
  if(d.go)return go(d.go);
  if(d.cf){curCat=d.cf;return render()}
  if(d.hit){D.last=cur=d.hit;save();view='preview';q=d.hc;render();return scrollTo(0,0)}
  if(d.pick){sel.has(d.pick)?sel.delete(d.pick):sel.add(d.pick);return render()}
  if(d.gf)return gPick(d.gf,d.gn);
  if(d.open){D.last=cur=d.open;save();view='preview';q='';render();return scrollTo(0,0)}
  if(d.cont){D.last=cur=d.cont;save();view='preview';q='';render();return startScan()}
  if(d.ren)return renameFile(D.files.find(f=>f.id===d.ren));
  if(d.delf)return delFile(D.files.find(f=>f.id===d.delf));
  if(d.rec){const r=F().records.find(x=>x.id===d.rec);return entryForm(r.code,r)}
  if(d.delr)return delRec(F().records.find(x=>x.id===d.delr));
  if(d.mode){draft.mode=d.mode;document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));return}
  if(d.look||d.md){syncDraft();if(d.look)draft.look=d.look;else draft.md=d.md;const y=scrollY;render();scrollTo(0,y);return}
  if(d.lg){draft.lang=d.lg;document.querySelectorAll('[data-lg]').forEach(o=>o.classList.toggle('on',o===b));return}
  if(d.dl){draft.delay=Math.min(10,Math.max(.5,draft.delay+Number(d.dl)));$('#dlv').textContent=fmt(draft.delay);return}
  switch(d.act){
    case 'close':return closeSheet();
    case 'newFile':return newFile();
    case 'contLast':cur=D.last;view='preview';render();return startScan();
    case 'send':return sendBox();
    case 'scan':return startScan();
    case 'findScan':return startScan(true);
    case 'manual':return manualBox();
    case 'photo':pause();return $('#photoIn').click();
    case 'scanClose':return stopScan();
    case 'lang':D.set.lang=L()==='en'?'ar':'en';save();return render();
    case 'torch':return toggleTorch();
    case 'zoom':return cycleZoom();
    case 'backup':return backup();
    case 'restore':return $('#restoreIn').click();
    case 'bk':return bkSheet();
    case 'upl':return uplSheet();
    case 'goUpl':upl=null;return go('uploads');
    case 'uplRef':upl=null;return render();
    case 'goUsers':uList=null;return go('users');
    case 'accOut':return accOut();
    case 'accOutY':return accOutY();
    case 'ghSet':return ghSet();
    case 'ghSave':return ghSave();
    case 'uAdd':return uAdd();
    case 'uAddY':return uAddY();
    case 'shareApp':{const url='https://mahmoudbassiuoni.github.io/rasd/download.html',txt=t('shareTxt');
      if(window.RasdNative&&RasdNative.shareText){RasdNative.shareText(txt+'\n'+url);return}
      if(navigator.share&&!inArtifact){navigator.share({title:t('app'),text:txt,url}).catch(()=>{});return}
      (async()=>{try{await navigator.clipboard.writeText(txt+' '+url);toast(t('linkCopied'),'ok')}catch(x){toast(url)}})();return}
    case 'chkUpd':try{RasdNative.checkUpdate()}catch(x){}return;
    case 'bkShare':return bkShareF();
    case 'gNow':return driveBackup(true);
    case 'gLink':return gAuth(false);
    case 'gRestore':return gRestoreList();
    case 'gAutoT':{const on=!gAuto();if(on){LS.set('rasd_gauto',true);if(!gtok())return gAuth(false);gTouch();driveBackup(true)}else LS.set('rasd_gauto',false);return bkSheet()}
    case 'undoRs':return undoRestore();
    case 'selOn':selMode=true;sel=new Set();return render();
    case 'mergeSel':return mergeFiles(sel);
    case 'imp':return impSheet();
    case 'moveSel':return moveSheet();
    case 'addCat':return catSheet();
    case 'manCats':return manCats();
    case 'selOff':selMode=false;sel.clear();return render();
    case 'selAll':{const fs=byDate();sel=sel.size===fs.length?new Set():new Set(fs.map(f=>f.id));return render()}
    case 'delSel':{if(!sel.size)return toast(t('noneSel'),'bad');const n=sel.size;return confirmBox(t('delFilesQ',{n:fmt(n)}),t('delSel',{n:fmt(n)}),()=>{D.files=D.files.filter(f=>!sel.has(f.id));if(sel.has(D.last))D.last=byDate()[0]?.id||null;if(sel.has(cur))cur=null;sel.clear();selMode=false;save();render();toast(t('deleted'))})}
    case 'saveSet':{
      syncDraft();
      if(!draft.formats.length)return toast(t('pickFmt'),'bad');
      D.set=draft;save();decInit=false;draft=null;toast(t('setSaved'),'ok');return go('home')}
  }

async function fbUser(){const f=await fbLoad(),me=accMe();if(!me)throw new Error('sign');
  if(!f.auth.currentUser)await new Promise(r=>{const un=f.au.onAuthStateChanged(f.auth,()=>{un();r()});setTimeout(r,3000)});
  const cu=f.auth.currentUser;if(cu&&(cu.email||'').toLowerCase()===me.e)return f;
  if(cu)await f.au.signOut(f.auth);
  for(let i=0;i<2;i++){if(!await sTok())throw new Error('sign');try{await f.au.signInWithCredential(f.auth,f.au.GoogleAuthProvider.credential(null,gtok()));return f}catch(e){LS.set('rasd_gtok',null);if(i)throw e}}}

const isoD=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dayN=s=>{try{return new Date(s+'T12:00').toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}};
const tm=s=>{if(!s)return '';const [h,m]=s.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString(loc(),{hour:'numeric',minute:'2-digit'})};

  <div class="acts"><button class="btn pri" id="uGo">${ic('up')} ${t('upGo')}</button><button class="btn" data-act="close">${t('cancel')}</button></div></div>`);$('#veil').classList.add('top');
  $('#uGo').onclick=async()=>{const v={ta:$('#uTa').value.trim(),date:$('#uDate').value,hall:$('#uHall').value.trim(),from:$('#uFrom').value,to:$('#uTo').value};
